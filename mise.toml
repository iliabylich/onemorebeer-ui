[tasks.sync]
run = 'cargo run -- --sync'

[tasks.web]
run = 'cargo run -- --web'

[tasks.build-deb]
run = [
    'cargo build --target=x86_64-unknown-linux-musl --release',
    'strip target/x86_64-unknown-linux-musl/release/onemorebeer-ui',
    'cargo deb --deb-revision="$(date +%s)" --target=x86_64-unknown-linux-musl',
]
